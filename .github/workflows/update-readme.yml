name: Update README

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs (excluding my own repos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X GET search/issues \
            -f q="is:pr is:merged author:ce-dric -user:ce-dric" \
            -f sort=updated -f order=desc -f per_page=10 \
            --jq '.items[] | "- 🎉 [\(.title)](\(.html_url)) — `\(.repository_url | ltrimstr("https://api.github.com/repos/"))`"' \
            > /tmp/merged_prs.txt

      - name: Update README between the markers
        run: |
          python3 - <<'PYEOF'
          import re

          with open("/tmp/merged_prs.txt") as f:
              lines = f.read().rstrip("\n") or "_No merged PRs yet._"

          with open("README.md") as f:
              readme = f.read()

          new_section = (
              "<!--START_SECTION:merged-prs-->\n"
              f"{lines}\n"
              "<!--END_SECTION:merged-prs-->"
          )
          readme = re.sub(
              r"<!--START_SECTION:merged-prs-->.*?<!--END_SECTION:merged-prs-->",
              new_section, readme, flags=re.S,
          )

          with open("README.md", "w") as f:
              f.write(readme)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m ":tada: Update merged PRs"
          git push
